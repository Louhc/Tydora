[package]
name = "tydora-desktop"
description = "A modern Markdown editor built with Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 原 src-tauri/ 保留的 lib 名 tydora_lib：
# - main.rs 通过 tydora_lib::run() 入口
# - staticlib/cdylib 适配移动端（gen/icons/android 等仍在）
[lib]
name = "tydora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", features = ["default"] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "brotli"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
portable-pty = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
url = "2"
fontdb = "0.23"

# Windows：「在资源管理器中打开并选中文件」用 Shell API 实现（见 lib.rs 的 open_file_location）。
# 版本与 workspace 里已有的 windows-sys 一致（tydora-cli 在用同一个 0.59），无需联网解析。
# Win32_UI_Shell 提供 ILCreateFromPathW / SHOpenFolderAndSelectItems / ILFree。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

# macOS 原生窗口圆角（CALayer），避免 CSS overflow+radius 触发 WKWebView 幽灵选区
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "CALayer",
  "CAMediaTiming",
  "objc2-core-foundation",
] }
